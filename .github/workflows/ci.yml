name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Compile
        run: python -m compileall -q chatgpt_export
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Shell and browser syntax
        run: |
          bash -n install.sh
          bash -n scripts/*.sh
          bash -n update.sh
          bash -n uninstall.sh
          bash -n setup-domain.sh
          bash install.sh --help >/dev/null
          node --check chatgpt_export/static/app.js
      - name: ShellCheck
        if: matrix.python == '3.12'
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get -o DPkg::Lock::Timeout=180 update -qq
            sudo apt-get -o DPkg::Lock::Timeout=180 install -y shellcheck
          fi
          shellcheck -x install.sh update.sh uninstall.sh setup-domain.sh scripts/*.sh
      - name: Installer syntax-guard regression
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cp -a . "$tmp/repo"
          printf '\nif (BROKEN)); then :; fi\n' >> "$tmp/repo/scripts/install_impl.sh"
          if bash "$tmp/repo/install.sh" --dry-run >"$tmp/out" 2>&1; then
            echo "Installer accepted a syntactically broken release." >&2
            cat "$tmp/out" >&2
            exit 1
          fi
          grep -q "Release shell syntax validation failed before installation" "$tmp/out"
      - name: Piped bootstrap regression
        if: matrix.python == '3.12'
        run: |
          set -Eeuo pipefail
          cat install.sh | sudo bash -s -- --dry-run > /tmp/chatgpt-export-piped.out 2>&1
          if grep -q "BASH_SOURCE.*unbound variable" /tmp/chatgpt-export-piped.out; then
            cat /tmp/chatgpt-export-piped.out >&2
            exit 1
          fi
      - name: Full installer systemd E2E
        if: matrix.python == '3.12'
        run: |
          set -Eeuo pipefail
          cleanup() {
            sudo systemctl disable --now chatgpt-export.service >/dev/null 2>&1 || true
            sudo rm -f /etc/systemd/system/chatgpt-export.service
            sudo systemctl daemon-reload >/dev/null 2>&1 || true
            sudo rm -rf /opt/chatgpt-export-ci /etc/chatgpt-export-ci /var/lib/chatgpt-export-ci
            sudo rm -f /usr/local/sbin/chatgpt-exportctl
          }
          trap cleanup EXIT
          sudo env \
            CHATGPT_EXPORT_INSTALL_ROOT=/opt/chatgpt-export-ci \
            CHATGPT_EXPORT_CONFIG_DIR=/etc/chatgpt-export-ci \
            CHATGPT_EXPORT_STATE_DIR=/var/lib/chatgpt-export-ci \
            CHATGPT_EXPORT_PORT=18788 \
            bash ./install.sh
          curl -fsS --max-time 5 http://127.0.0.1:18788/healthz

          status_out="$(sudo chatgpt-exportctl status)"
          printf '%s\n' "$status_out"
          grep -Fq "ChatGPT-Export  ✓ running" <<<"$status_out"
          grep -Fq "Health          ✓ OK" <<<"$status_out"
          grep -Fq "UI              http://127.0.0.1:18788" <<<"$status_out"
          grep -Fq "Export         — not started" <<<"$status_out"

          doctor_out="$(sudo chatgpt-exportctl doctor)"
          printf '%s\n' "$doctor_out"
          grep -Fxq "✓ Doctor: all checks passed." <<<"$doctor_out"

          sudo systemctl is-active --quiet chatgpt-export.service
      - name: Import smoke test
        env:
          CHATGPT_EXPORT_STATE_DIR: /tmp/chatgpt-export-state
          CHATGPT_EXPORT_DATA_DIR: /tmp/chatgpt-export-state/data
          CHATGPT_EXPORT_CONFIG_DIR: /tmp/chatgpt-export-config
          CHATGPT_EXPORT_KEY_FILE: /tmp/chatgpt-export-config/fernet.key
          CHATGPT_EXPORT_ADMIN_TOKEN_FILE: /tmp/chatgpt-export-config/admin.token
        run: |
          mkdir -p /tmp/chatgpt-export-config
          python - <<'PY'
          from cryptography.fernet import Fernet
          from pathlib import Path
          Path('/tmp/chatgpt-export-config/fernet.key').write_bytes(Fernet.generate_key()+b'\n')
          Path('/tmp/chatgpt-export-config/admin.token').write_text('a'*64+'\n')
          import chatgpt_export.app
          from fastapi.testclient import TestClient
          with TestClient(chatgpt_export.app.app) as client:
              response = client.get('/healthz')
              assert response.status_code == 200
              assert response.headers['strict-transport-security'] == 'max-age=31536000'
              assert response.headers['permissions-policy'] == 'camera=(), microphone=(), geolocation=()'
              assert response.headers['cross-origin-opener-policy'] == 'same-origin'
              assert response.headers['x-permitted-cross-domain-policies'] == 'none'
          print('import + security headers ok')
          PY
      - name: Secret-pattern scan
        run: |
          if grep -RInE --exclude-dir=.git --exclude='*.md' '(sk-proj-[A-Za-z0-9_-]{20,}|Bearer[[:space:]]+[A-Za-z0-9._~+/-]{40,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' .; then
            echo "Potential credential material detected." >&2
            exit 1
          fi
